[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lithophane-studio"
version = "1.0.0"
description = "Turn a photo into a printable 3D lithophane (STL/OBJ). Runs locally in your browser, nothing is uploaded."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "metiutek" }]
keywords = ["lithophane", "3d-printing", "stl", "image-to-stl", "heightmap"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Web Environment",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.urls]
Homepage = "https://metiutek.github.io/lithophane-studio/"
Source = "https://github.com/metiutek/lithophane-studio"

[project.scripts]
lithophane = "lithophane_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lithophane_studio"]

# the web app lives at the repo root (served as-is by GitHub Pages); ship a copy inside the package
[tool.hatch.build.targets.wheel.force-include]
"index.html" = "lithophane_studio/web/index.html"
"app.js" = "lithophane_studio/web/app.js"
"mesh.js" = "lithophane_studio/web/mesh.js"
"style.css" = "lithophane_studio/web/style.css"
"vendor" = "lithophane_studio/web/vendor"

[tool.hatch.build.targets.sdist]
include = ["lithophane_studio", "index.html", "app.js", "mesh.js", "style.css", "vendor", "README.md", "LICENSE", "test"]
